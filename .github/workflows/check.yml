# Runs the repo gate (scripts/check.sh, wt.gate) — the same script agents and
# humans run locally (contract C5.2). CI adds nothing the gate doesn't check: it only
# installs the tools the project-type scaffolds need (bats, terraform, tflint; Docker
# comes with the runner) and runs the gate with --strict, so no scaffold check is skipped.
# The binary pins below match the ones in project/.github/workflows/check.yml.jinja.
# `wt` (devops-workspace) is not installed here, so the `wt doctor` checks are skipped
# in CI and run on mmisadmin02.
name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: gate (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # Oldest supported and newest stable.
        python: ["3.10", "3.14"]
    steps:
      # Actions are pinned to full commit SHAs (tag in the comment);
      # Dependabot (.github/dependabot.yml) proposes updates.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.13"
          enable-cache: true
          # Tool pins (ruff, shellcheck-py, actionlint-py, copier, yamllint) live in
          # check.sh; the scaffolds' tool pins in project/scripts/check.sh.jinja.
          cache-dependency-glob: |
            scripts/check.sh
            project/scripts/check.sh.jinja

      - name: Install bats-core (pinned, checksum verified)
        env:
          BATS_VERSION: "1.14.0"
          BATS_SHA256: bb537b70b15b732f6d8827dd6578e3d8ce166636ce1f18ea9a074184fcce9177
        run: |
          curl -fsSL -o "$RUNNER_TEMP/bats.tar.gz" "https://github.com/bats-core/bats-core/archive/refs/tags/v${BATS_VERSION}.tar.gz"
          echo "${BATS_SHA256}  $RUNNER_TEMP/bats.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/bats.tar.gz" -C "$RUNNER_TEMP"
          sudo "$RUNNER_TEMP/bats-core-${BATS_VERSION}/install.sh" /usr/local

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.16.6"
          terraform_wrapper: false

      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: v0.64.0
          checksums: cca9d13e2e1d7a2c627af60ff899a3c9b74212899416aeb96ec764d2ef954537

      - name: Run gate
        run: scripts/check.sh --strict
        env:
          PYTHON: python

      - name: Gate left the tree clean
        run: |
          git status --porcelain
          test -z "$(git status --porcelain)"
